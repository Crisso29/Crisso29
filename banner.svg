<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" width="900" height="540" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="540" fill="#FAFAF8"/>

  <!-- Línea superior -->
  <rect x="55" y="52" width="790" height="1.5" fill="#0A0A0A"/>

  <!-- Etiqueta top -->
  <text x="55" y="46" font-size="10.5" fill="#999" letter-spacing="3.5" font-weight="400" font-family="Helvetica Neue, Arial, sans-serif">SYSTEMS ENGINEERING · UNSCH · AYACUCHO, PERÚ</text>

  <!-- Nombre línea 1 sólido -->
  <text x="48" y="178" font-size="122" font-weight="900" fill="#0A0A0A" letter-spacing="-5" font-family="Helvetica Neue, Arial, sans-serif">CRISÓLOGO</text>

  <!-- Nombre línea 2 outline -->
  <text x="48" y="285" font-size="122" font-weight="900" fill="none" stroke="#0A0A0A" stroke-width="2.2" letter-spacing="-5" font-family="Helvetica Neue, Arial, sans-serif">AGUILAR</text>

  <!-- Acento morado -->
  <rect x="55" y="308" width="48" height="3" fill="#A78BFA"/>

  <!-- Descripción -->
  <text x="55" y="350" font-size="16" font-weight="300" fill="#2A2A2A" letter-spacing="0.3" font-family="Helvetica Neue, Arial, sans-serif">Amante del arte, la ingeniería y el desarrollo.</text>
  <text x="55" y="374" font-size="16" font-weight="300" fill="#2A2A2A" letter-spacing="0.3" font-family="Helvetica Neue, Arial, sans-serif">Aprendo en profundidad — me interesan las cosas difíciles.</text>

  <!-- 2026 fondo -->
  <text x="895" y="510" font-size="115" font-weight="900" fill="none" stroke="#EBEBEB" stroke-width="1.5" text-anchor="end" letter-spacing="-4" font-family="Helvetica Neue, Arial, sans-serif">2026</text>

  <!-- Línea divisoria -->
  <rect x="55" y="402" width="790" height="0.8" fill="#E0E0E0"/>


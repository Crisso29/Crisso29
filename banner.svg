  <text x="55" y="430" font-size="11" font-weight="700" fill="#A78BFA" letter-spacing="2" font-family="Helvetica Neue, Arial, sans-serif">STACK</text>
  <text x="116" y="430" font-size="12" font-weight="300" fill="#555" letter-spacing="0.4" font-family="Helvetica Neue, Arial, sans-serif">Python · C# · SQL · Git · SonarQube · Postman · Jira · .NET MAUI</text>


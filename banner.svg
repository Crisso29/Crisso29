<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" width="900" height="540" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="540" fill="#0D0D0D"/>

  <!-- Línea superior -->
  <rect x="55" y="52" width="790" height="1" fill="#2A2A2A"/>

  <!-- Etiqueta top -->
  <text x="55" y="46" font-size="10.5" fill="#4A4A4A" letter-spacing="3.5" font-weight="400" font-family="Helvetica Neue, Arial, sans-serif">SYSTEMS ENGINEERING · UNSCH · AYACUCHO, PERÚ</text>

  <!-- Nombre línea 1 sólido — pastel lavanda -->
  <text x="48" y="178" font-size="122" font-weight="900" fill="#C9B8F5" letter-spacing="-5" font-family="Helvetica Neue, Arial, sans-serif">CRISOLOGO</text>

  <!-- Nombre línea 2 outline — pastel suave -->
  <text x="48" y="285" font-size="122" font-weight="900" fill="none" stroke="#7C6FAB" stroke-width="2" letter-spacing="-5" font-family="Helvetica Neue, Arial, sans-serif">AGUILAR</text>

  <!-- Acento color menta -->
  <rect x="55" y="308" width="48" height="3" fill="#89D4CF"/>

  <!-- Descripción -->
  <text x="55" y="350" font-size="16" font-weight="300" fill="#B8B8C8" letter-spacing="0.3" font-family="Helvetica Neue, Arial, sans-serif">Amante del arte, la ingeniería y el desarrollo.</text>
  <text x="55" y="374" font-size="16" font-weight="300" fill="#B8B8C8" letter-spacing="0.3" font-family="Helvetica Neue, Arial, sans-serif">Aprendo en profundidad — me interesan las cosas difíciles.</text>

  <!-- 2026 fondo sutil -->
  <text x="895" y="510" font-size="115" font-weight="900" fill="none" stroke="#1E1E1E" stroke-width="1.5" text-anchor="end" letter-spacing="-4" font-family="Helvetica Neue, Arial, sans-serif">2026</text>

  <!-- Línea divisoria -->
  <rect x="55" y="402" width="790" height="0.8" fill="#222222"/>

  <!-- Stack -->
  <text x="55" y="430" font-size="11" font-weight="700" fill="#89D4CF" letter-spacing="2" font-family="Helvetica Neue, Arial, sans-serif">STACK</text>
  <text x="116" y="430" font-size="12" font-weight="300" fill="#7A7A9A" letter-spacing="0.4" font-family="Helvetica Neue, Arial, sans-serif">Python · C# · SQL · Git · SonarQube · Postman · Jira · .NET MAUI</text>

  <!-- Proyectos encabezado -->
  <text x="55" y="458" font-size="11" font-weight="700" fill="#89D4CF" letter-spacing="2" font-family="Helvetica Neue, Arial, sans-serif">PROYECTOS</text>

  <!-- Proyecto 1 -->
  <text x="55" y="480" font-size="12" font-weight="500" fill="#C9B8F5" font-family="Helvetica Neue, Arial, sans-serif">SafeWoman</text>
  <text x="148" y="480" font-size="12" font-weight="300" fill="#4A4A6A" font-family="Helvetica Neue, Arial, sans-serif">— App móvil de seguridad para mujeres · .NET MAUI</text>

  <!-- Proyecto 2 -->
  <text x="55" y="500" font-size="12" font-weight="500" fill="#C9B8F5" font-family="Helvetica Neue, Arial, sans-serif">ViaLibre</text>
  <text x="117" y="500" font-size="12" font-weight="300" fill="#4A4A6A" font-family="Helvetica Neue, Arial, sans-serif">— Detección automática de anomalías viales · Python + IoT</text>

  <!-- Línea inferior -->
  <rect x="55" y="525" width="790" height="1" fill="#2A2A2A"/>
</svg>
